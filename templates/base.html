<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LiBros - Bibliothekssystem{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero-banner { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 2.5rem 1rem; border-radius: 0.5rem; }
        .card-custom { transition: transform 0.2s; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.08); }
        .card-custom:hover { transform: translateY(-4px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">📚 LiBros</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'loans:catalog' %}">📖 Ausleihe (UC-01)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'returns:station' %}">📟 Rückgabestation (UC-02)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'reservations:index' %}">📅 Reservierung (UC-03)</a>
                    </li>
                </ul>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'home' %}">Übersicht</a>
                    <a class="nav-link" href="/admin/">Django Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4 border-top">
        <div class="container">
            <small>LiBros &copy; Fachhochschule Salzburg GmbH &bull; Software Design Lab</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
