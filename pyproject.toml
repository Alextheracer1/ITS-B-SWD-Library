[project]
name = "its-b-swd-library"
version = "0.1.0"
description = "LiBros - Zentrales Bibliotheks-Management-System (SWD-Projekt FH Salzburg)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7.0",
    "djangorestframework>=3.15.0",
    "sqlparse>=0.5.0",
    "asgiref>=3.8.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9",
]
mysql = [
    "mysqlclient>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

# Für Django-Anwendungen: Projekt nicht als Python-Wheel paketieren, sondern als App verwalten
[tool.uv]
package = false
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "libros_project"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
